name: Build IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Compile Swift & Package IPA
        run: |
          mkdir -p Payload/NeonSudoku.app
          
          xcrun swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -target arm64-apple-ios15.0 \
            ContentView.swift \
            -o Payload/NeonSudoku.app/NeonSudoku
            
          cat << 'EOF' > Payload/NeonSudoku.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>NeonSudoku</string>
              <key>CFBundleIdentifier</key><string>com.neonsudoku.app</string>
              <key>CFBundleName</key><string>NeonSudoku</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
          </dict>
          </plist>
          EOF
          
          zip -r NeonSudoku.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: NeonSudoku-IPA
          path: NeonSudoku.ipa
